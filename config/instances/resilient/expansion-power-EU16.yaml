# yaml-language-server: $schema=../../schema.default.json

# The stochastic capacity expansion of the European power system in 2030 built
# by the generator of plan4res/resilient (ENVIS NECPEssentials, 16 regions,
# hourly steps, continuous investment), from 1 to 4 weeks starting on 2 July
# and with 21 to 105 scenarios of the demand and of the availability of the
# renewables, solved by PyPSA with GUROBI and by SMS++ on the
# TwoStageStochasticBlock. Three more cases go beyond the weeks: the first
# day of each month of 2030, each weighing the days of its month on average
# (y1d12_s21), the whole year of 8760 hours (y1_s21), and the first week with
# the unit commitment of the thermal generators (w1_s21_uc), to be compared
# with w1_s21 on the same network. With the configurations of SMS++ for
# BundleSolver 2.0 the Benders decomposition is the option smspp-tssb-bds,
# to be added to solving.solver.
#
#   snakemake -c 32 solve_resilient_all \
#     --configfile config/instances/resilient/expansion-power-EU16.yaml

run:
  prefix: "resilient-expansion-power-EU16"
  name: all
  disable_progressbar: true
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false

foresight: overnight

resilient:
  generator:
    url: https://github.com/plan4res/resilient.git
    commit: b2629d4458
  cases:
    w1_s21:
      begin: 02/07/2030
      end: 08/07/2030
      scenarios: 21
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    w1_s52:
      begin: 02/07/2030
      end: 08/07/2030
      scenarios: 52
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    w1_s105:
      begin: 02/07/2030
      end: 08/07/2030
      scenarios: 105
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    w2_s21:
      begin: 02/07/2030
      end: 15/07/2030
      scenarios: 21
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    w2_s105:
      begin: 02/07/2030
      end: 15/07/2030
      scenarios: 105
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    w4_s21:
      begin: 02/07/2030
      end: 29/07/2030
      scenarios: 21
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    w4_s105:
      begin: 02/07/2030
      end: 29/07/2030
      scenarios: 105
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    y1d12_s21:
      begin: 01/01/2030
      end: 31/12/2030
      days: [01/01/2030, 01/02/2030, 01/03/2030, 01/04/2030, 01/05/2030,
             01/06/2030, 01/07/2030, 01/08/2030, 01/09/2030, 01/10/2030,
             01/11/2030, 01/12/2030]
      scenarios: 21
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    y1_s21:
      begin: 01/01/2030
      end: 31/12/2030
      scenarios: 21
      extendable: true
      committable: false
      stochastic: [demand, renewables]
    w1_s21_uc:
      begin: 02/07/2030
      end: 08/07/2030
      scenarios: 21
      extendable: true
      committable: true
      stochastic: [demand, renewables]

solving:
  options:
    skip_iterations: true
    transmission_losses: 0
    linearized_unit_commitment: false
    noisy_costs: false
  solver_options:
    # smspp-tssb with the run-of-river generators of the generator, whose
    # carrier is hydro, among the intermittent ones: their availability comes
    # in scenarios as that of wind and solar does
    smspp-tssb-resilient:
      capacity_expansion_ucblock: true
      configfile: config/smspp/TSSBlock/TSSBCfg_grb.txt
      intermittent_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc,
                              offwind-float, PV, wind, ror, hydro]
      stochastic_parameters:
        stochastic_type: tssb
        parameters:
        - demand
        - renewable_maxpower
  solver:
    name: [gurobi, smspp]
    options: [gurobi-default, smspp-tssb-resilient]
