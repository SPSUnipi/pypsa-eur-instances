# yaml-language-server: $schema=../../schema.default.json

run:
  prefix: "capacity-expansion-tssb-power-IT-noUC-threads"
  name: all
  scenarios:
    enable: true
    file: config/instances/scenarios/tssb/scenarios-power-limited.yaml
  disable_progressbar: true
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false

foresight: overnight

scenario:
  clusters:
  - 5

  opts:
  - ''

countries:
- IT

stochastic_scenarios:
  enable: true
  file: config/instances/scenarios/tssb/stochastic-demand_3.yaml
  export:
    average: true
    scenarios: true
  postprocess:
    use_average: false
    scenarios: false

clustering:
  temporal:
    resolution_elec: 48c24

solving:
  options:
    load_shedding: 
      enable: true
    skip_iterations: true
    transmission_losses: 0
    linearized_unit_commitment: false
    noisy_costs: false
  solver:
    name: [gurobi, gurobi, smspp, smspp]
    options: [gurobi-16, gurobi-64, smspp-tssb-ib-16, smspp-tssb-ib-64]
