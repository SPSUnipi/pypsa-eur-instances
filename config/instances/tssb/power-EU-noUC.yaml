# yaml-language-server: $schema=../../schema.default.json

run:
  prefix: "capacity-expansion-tssb-power-EU-noUC"
  name: all
  scenarios:
    enable: true
    file: config/instances/scenarios/tssb/scenarios-power.yaml
  disable_progressbar: true
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false

foresight: overnight

scenario:
  clusters:
  - 5
  - 20

  opts:
  - ''

countries:
- AL
- AT
- BA
- BE
- BG
- CH
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GB
- GR
- HR
- HU
- IE
- IT
- LT
- LU
- LV
- ME
- MK
- NL
- 'NO'
- PL
- PT
- RO
- RS
- SE
- SI
- SK
- XK

stochastic_scenarios:
  enable: true
  file: config/instances/scenarios/tssb/stochastic-demand_3.yaml
  export:
    average: true
    scenarios: true
  postprocess:
    use_average: false
    scenarios: false

clustering:
  temporal:
    resolution_elec: 48c24

solving:
  options:
    load_shedding: 
      enable: true
    skip_iterations: true
    transmission_losses: 0
    linearized_unit_commitment: false
    noisy_costs: false
  solver:
    # name: [gurobi, smspp, smspp, smspp]
    # options: [gurobi-default, smspp-tssb, smspp-tssb-bds, smspp-tssb-ib-par]
    name: [gurobi, smspp]
    options: [gurobi-default, smspp-tssb-ib-par]
