# yaml-language-server: $schema=schema.default.json

run:
  prefix: "instances_unipi"
  name: all
  scenarios:
    enable: true
    file: config/performance_instances/scenarios_power-IT-dispatch.yaml
  disable_progressbar: true
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false

foresight: overnight

scenario:
  clusters:
  - 2
  - 20
  - 50
  opts:
  - ''

countries:
- IT

electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

clustering:
  temporal:
    resolution_elec: 48c24

solving:
  options:
    load_shedding: 
      enable: true
    skip_iterations: true
    transmission_losses: 0
    linearized_unit_commitment: false
    noisy_costs: false
  solver:
    name: [gurobi, smspp, smspp]
    options: [gurobi-default, smspp-ucblock, smspp-investmentblock]
  solver_options:
    smspp-ucblock:
      capacity_expansion_ucblock: true
    smspp-investmentblock:
      capacity_expansion_ucblock: false
